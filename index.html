<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLS Applicant Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', -apple-system, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 50%, #fff3e0 100%);
            min-height: 100vh;
            padding: 30px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            background: white;
            border-radius: 24px;
            padding: 35px 40px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
        
        .sync-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sync-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        
        .sync-dot.disconnected {
            background: #f44336;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
        }
        
        .stat-card:nth-child(1)::before { background: linear-gradient(90deg, #2196F3, #00BCD4); }
        .stat-card:nth-child(2)::before { background: linear-gradient(90deg, #9C27B0, #E91E63); }
        .stat-card:nth-child(3)::before { background: linear-gradient(90deg, #FF9800, #FF5722); }
        
        .stat-card .icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        .stat-card:nth-child(1) .icon { background: linear-gradient(135deg, #2196F3, #00BCD4); }
        .stat-card:nth-child(2) .icon { background: linear-gradient(135deg, #9C27B0, #E91E63); }
        .stat-card:nth-child(3) .icon { background: linear-gradient(135deg, #FF9800, #FF5722); }
        
        .stat-card h3 {
            font-size: 48px;
            color: #212121;
            font-weight: 900;
            margin-bottom: 8px;
        }
        
        .stat-card p {
            color: #757575;
            font-size: 16px;
            font-weight: 500;
        }
        
        .main-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #212121;
            margin-bottom: 24px;
        }
        
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            padding: 16px 24px;
            background: #f5f5f5;
            border: none;
            border-radius: 16px;
            color: #212121;
            font-size: 16px;
            min-width: 200px;
        }
        
        .search-box:focus { outline: none; background: #eeeeee; }
        .search-box::placeholder { color: #9e9e9e; }
        
        .btn {
            padding: 16px 28px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn:hover { transform: translateY(-2px); }
        
        .btn-blue {
            background: linear-gradient(135deg, #2196F3, #00BCD4);
            color: white;
            box-shadow: 0 4px 16px rgba(33, 150, 243, 0.4);
        }
        
        .btn-blue:hover { box-shadow: 0 6px 24px rgba(33, 150, 243, 0.5); }
        
        .btn-purple {
            background: linear-gradient(135deg, #9C27B0, #E91E63);
            color: white;
            box-shadow: 0 4px 16px rgba(156, 39, 176, 0.4);
        }
        
        .btn-purple:hover { box-shadow: 0 6px 24px rgba(156, 39, 176, 0.5); }
        
        .btn-orange {
            background: linear-gradient(135deg, #FF9800, #FF5722);
            color: white;
            box-shadow: 0 4px 16px rgba(255, 152, 0, 0.4);
        }
        
        .btn-orange:hover { box-shadow: 0 6px 24px rgba(255, 152, 0, 0.5); }
        
        .btn-green {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            color: white;
            box-shadow: 0 4px 16px rgba(76, 175, 80, 0.4);
        }
        
        .btn-green:hover { box-shadow: 0 6px 24px rgba(76, 175, 80, 0.5); }
        
        .btn-red {
            background: linear-gradient(135deg, #f44336, #e91e63);
            color: white;
            box-shadow: 0 4px 16px rgba(244, 67, 54, 0.4);
        }
        
        .groups-filter {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        
        .group-badge {
            padding: 12px 24px;
            background: #f5f5f5;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .group-badge:hover {
            background: #eeeeee;
            transform: translateY(-2px);
        }
        
        .group-badge.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .group-delete {
            margin-left: 8px;
            color: #f44336;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.7;
        }
        
        .group-delete:hover {
            opacity: 1;
            transform: scale(1.2);
        }
        
        .applicant-cards {
            display: grid;
            gap: 20px;
        }
        
        .applicant-card {
            background: #fafafa;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .applicant-card:hover {
            background: white;
            border-color: #667eea;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            transform: translateX(8px);
        }
        
        .photo-thumb {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        
        .applicant-info {
            flex: 1;
            min-width: 0;
        }
        
        .applicant-name {
            font-size: 20px;
            font-weight: 700;
            color: #212121;
            margin-bottom: 6px;
        }
        
        .applicant-details {
            display: flex;
            gap: 24px;
            color: #757575;
            font-size: 14px;
            flex-wrap: wrap;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        
        .badge-blue {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            color: #1976D2;
        }
        
        .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .action-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #757575;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .action-btn:hover {
            transform: scale(1.1);
            color: #667eea;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9e9e9e;
        }
        
        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            padding: 30px;
            border-bottom: 2px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            font-size: 24px;
            color: #212121;
            font-weight: 700;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #9e9e9e;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        .close-btn:hover {
            background: #f5f5f5;
            color: #212121;
        }
        
        .modal-body {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 14px;
            color: #212121;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #eeeeee;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .modal-footer {
            padding: 20px 30px;
            border-top: 2px solid #f5f5f5;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 20px 30px;
            background: #212121;
            color: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 2000;
            animation: slideIn 0.3s ease;
            font-weight: 600;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .toast.success {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
        }
        
        .toast.error {
            background: linear-gradient(135deg, #f44336, #e91e63);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>💼 BLS APPLICANT MANAGER</h1>
            </div>
            <div class="sync-status">
                <div class="sync-dot" id="ws-status"></div>
                <span id="ws-text" style="color: #757575; font-weight: 600;">Connecting...</span>
                <button class="btn btn-blue" onclick="syncNow()">🔄 SYNC</button>
                <button class="btn btn-purple" onclick="syncPhotosToExtensions()" title="Manually sync all applicants WITH photos to extensions">📤 SYNC WITH PHOTOS</button>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="icon">👥</div>
                <h3 id="total-applicants">0</h3>
                <p>Total Applicants</p>
            </div>
            <div class="stat-card">
                <div class="icon">📁</div>
                <h3 id="total-groups">0</h3>
                <p>Groups</p>
            </div>
            <div class="stat-card">
                <div class="icon">📸</div>
                <h3 id="with-photos">0</h3>
                <p>With Photos</p>
            </div>
        </div>
        
        <div class="main-card">
            <div class="section-title">Applicants</div>
            
            <div class="toolbar">
                <input type="text" class="search-box" id="search" placeholder="🔍 Search applicants..." oninput="filterApplicants()">
                <button class="btn btn-green" onclick="showAddModal()">➕ ADD NEW</button>
                <button class="btn btn-purple" onclick="showAddGroupModal()">📁 GROUPS</button>
                <button class="btn btn-blue" onclick="importData()">📤 IMPORT</button>
                <button class="btn btn-orange" onclick="exportData()">💾 EXPORT</button>
                <button class="btn btn-red" onclick="deleteAll()">🗑️ DELETE ALL</button>
            </div>
            
            <div class="groups-filter" id="groups-filter"></div>
            
            <div class="applicant-cards" id="applicant-list">
                <div class="empty-state">
                    <h3>Loading...</h3>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Applicant</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Group</label>
                    <select id="fg">
                        <option value="">No Group</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="ff" data-next="fl">
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="fl" data-next="fp">
                </div>
                <div class="form-group">
                    <label>Passport *</label>
                    <input type="text" id="fp" data-next="fd">
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="fd" data-next="fb">
                </div>
                <div class="form-group">
                    <label>Place of Birth</label>
                    <select id="fb" data-next="fi">
                        <option value="">Select city...</option>
                        <option value="CASABLANCA">CASABLANCA</option>
                        <option value="NADOR">NADOR</option>
                        <option value="RABAT">RABAT</option>
                        <option value="TETOUAN">TETOUAN</option>
                        <option value="AGADIR">AGADIR</option>
                        <option value="TANGER">TANGER</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Issue Place</label>
                    <select id="fi" data-next="fph">
                        <option value="">Select city...</option>
                        <option value="CASABLANCA">CASABLANCA</option>
                        <option value="NADOR">NADOR</option>
                        <option value="RABAT">RABAT</option>
                        <option value="TETOUAN">TETOUAN</option>
                        <option value="AGADIR">AGADIR</option>
                        <option value="TANGER">TANGER</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Photo (Max 200KB)</label>
                    <input type="file" id="fph" accept="image/*">
                    <div id="prev"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-red" onclick="closeModal()">CANCEL</button>
                <button class="btn btn-green" onclick="saveApplicant()">SAVE</button>
            </div>
        </div>
    </div>
    
    <!-- Add Group Modal -->
    <div id="group-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Group</h2>
                <button class="close-btn" onclick="closeGroupModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Group Name *</label>
                    <input type="text" id="new-group-name" placeholder="e.g. Family, Friends">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-red" onclick="closeGroupModal()">CANCEL</button>
                <button class="btn btn-green" onclick="saveGroup()">ADD GROUP</button>
            </div>
        </div>
    </div>
    
    <script>
        const API = window.location.origin;
        const WS_URL = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws';
        
        let ws = null;
        
        // Connect to WebSocket for live updates
        function connectWebSocket() {
            try {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = () => {
                    console.log('✅ Dashboard WebSocket connected');
                };
                
                ws.onmessage = async (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        console.log('📨 WebSocket update:', message.type);
                        
                        if (message.type === 'DATA_UPDATED') {
                            // Auto-refresh when data changes
                            console.log('🔄 Data updated - refreshing dashboard...');
                            await loadData();
                        }
                    } catch (error) {
                        console.error('❌ WebSocket message error:', error);
                    }
                };
                
                ws.onerror = () => {
                    console.error('❌ WebSocket error');
                };
                
                ws.onclose = () => {
                    console.log('❌ WebSocket closed - reconnecting in 5s...');
                    setTimeout(connectWebSocket, 5000);
                };
            } catch (error) {
                console.error('❌ WebSocket connection failed:', error);
                setTimeout(connectWebSocket, 5000);
            }
        }
        let apps = [], groups = [], editIdx = -1, filter = 'all';
        let ws = null;
        let wsReconnectTimer = null;

        // ==================== WEBSOCKET ====================
        
        function connectWebSocket() {
            const wsUrl = API.replace('https://', 'wss://').replace('http://', 'ws://') + '/ws';
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    console.log('✅ WebSocket connected');
                    document.getElementById('ws-status').classList.remove('disconnected');
                    document.getElementById('ws-text').textContent = 'Connected';
                    
                    if (wsReconnectTimer) {
                        clearTimeout(wsReconnectTimer);
                        wsReconnectTimer = null;
                    }
                };
                
                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        console.log('📨 WebSocket message:', message.type);
                        
                        if (message.type === 'INITIAL_DATA' || message.type === 'DATA_UPDATED') {
                            apps = message.data.applicants || [];
                            groups = message.data.groups || [];
                            updateUI();
                        }
                    } catch (e) {
                        console.error('Error processing message:', e);
                    }
                };
                
                ws.onerror = (error) => {
                    console.error('❌ WebSocket error:', error);
                };
                
                ws.onclose = () => {
                    console.log('❌ WebSocket disconnected');
                    document.getElementById('ws-status').classList.add('disconnected');
                    document.getElementById('ws-text').textContent = 'Disconnected';
                    
                    if (!wsReconnectTimer) {
                        wsReconnectTimer = setTimeout(() => {
                            console.log('🔄 Reconnecting WebSocket...');
                            connectWebSocket();
                        }, 5000);
                    }
                };
                
            } catch (error) {
                console.error('WebSocket connection failed:', error);
                wsReconnectTimer = setTimeout(connectWebSocket, 5000);
            }
        }

        // ==================== DATA MANAGEMENT ====================

        async function loadData() {
            try {
                const r = await fetch(API + '/api/applicants'); // Has photos now
                const d = await r.json();
                apps = d.applicants || [];
                groups = d.groups || [];
                
                // DEBUG: Check if photos are in the data
                const withPhotos = apps.filter(a => a.photo).length;
                console.log(`📊 Loaded ${apps.length} applicants, ${withPhotos} have photos`);
                if (withPhotos === 0 && apps.length > 0) {
                    console.warn('⚠️ NO PHOTOS in data! Photos might not be saved on server.');
                }
                
                updateUI();
            } catch (e) { 
                toast('Load failed', 'error'); 
            }
        }

        function render() {
            const container = document.getElementById('applicant-list');
            const search = document.getElementById('search').value.toLowerCase();
            
            let filtered = apps.filter(a => {
                const match = (a.FirstName||'').toLowerCase().includes(search) || 
                              (a.LastName||'').toLowerCase().includes(search) || 
                              (a.PassportNo||'').toLowerCase().includes(search);
                const grp = filter === 'all' || a.group === filter;
                return match && grp;
            });
            
            if (!filtered.length) {
                container.innerHTML = '<div class="empty-state"><h3>No applicants found</h3></div>';
                return;
            }
            
            const colors = ['#2196F3,#00BCD4', '#9C27B0,#E91E63', '#FF9800,#FF5722', '#4CAF50,#8BC34A', '#667eea,#764ba2'];
            
            container.innerHTML = filtered.map((a, i) => {
                const idx = apps.indexOf(a);
                const name = `${a.FirstName||''} ${a.LastName||''}`.trim() || 'Unnamed';
                const initials = ((a.FirstName||'')[0] + (a.LastName||'')[0]).toUpperCase();
                const colorPair = colors[idx % colors.length];
                
                const photoHtml = a.photo 
                    ? `<img src="${a.photo}" class="photo-thumb">` 
                    : `<div class="photo-thumb" style="background: linear-gradient(135deg, #${colorPair}); display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; font-weight: 700;">${initials || '👤'}</div>`;
                
                return `
                    <div class="applicant-card">
                        ${photoHtml}
                        <div class="applicant-info">
                            <div class="applicant-name">${name}</div>
                            <div class="applicant-details">
                                <div class="detail-item">📇 ${a.PassportNo || 'N/A'}</div>
                                <div class="detail-item">🎂 ${a.DateOfBirth || 'N/A'}</div>
                                ${a.PlaceOfBirth ? `<div class="detail-item">📍 ${a.PlaceOfBirth}</div>` : ''}
                            </div>
                        </div>
                        <span class="badge badge-blue">${a.group || 'No Group'}</span>
                        <div class="actions">
                            <button class="action-btn" onclick="edit(${idx})">✏️</button>
                            <button class="action-btn" onclick="del(${idx})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderGroups() {
            const c = document.getElementById('groups-filter');
            const sel = document.getElementById('fg');
            const cnt = { all: apps.length };
            apps.forEach(a => { if (a.group) cnt[a.group] = (cnt[a.group]||0) + 1; });
            
            let h = `<div class="group-badge ${filter==='all'?'active':''}" onclick="filterBy('all')">All (${cnt.all})</div>`;
            groups.forEach(g => {
                h += `<div class="group-badge ${filter===g?'active':''}">
                    <span onclick="filterBy('${g}')" style="flex: 1;">${g} (${cnt[g]||0})</span>
                    <span class="group-delete" onclick="event.stopPropagation(); deleteGroup('${g}')" title="Delete group">✖</span>
                </div>`;
            });
            c.innerHTML = h;
            
            const currentSelection = sel.value;
            sel.innerHTML = '<option value="">No Group</option>';
            groups.forEach(g => sel.innerHTML += `<option value="${g}">${g}</option>`);
            sel.value = currentSelection;
        }

        function updateStats() {
            document.getElementById('total-applicants').textContent = apps.length;
            document.getElementById('total-groups').textContent = groups.length;
            document.getElementById('with-photos').textContent = apps.filter(a => a.photo).length;
        }

        function updateUI() {
            render();
            renderGroups();
            updateStats();
        }

        function filterBy(g) { filter = g; updateUI(); }
        function filterApplicants() { render(); }

        // ==================== MODAL FUNCTIONS ====================

        function showAddModal() {
            editIdx = -1;
            document.getElementById('modal-title').textContent = 'Add Applicant';
            document.getElementById('ff').value = '';
            document.getElementById('fl').value = '';
            document.getElementById('fp').value = '';
            document.getElementById('fd').value = '';
            document.getElementById('fb').value = '';
            document.getElementById('fi').value = '';
            
            if (filter !== 'all' && groups.includes(filter)) {
                document.getElementById('fg').value = filter;
            } else {
                document.getElementById('fg').value = '';
            }
            
            document.getElementById('fph').value = '';
            document.getElementById('prev').innerHTML = '';
            document.getElementById('modal').classList.add('active');
            setTimeout(() => document.getElementById('ff').focus(), 100);
        }

        function showAddGroupModal() {
            document.getElementById('new-group-name').value = '';
            document.getElementById('group-modal').classList.add('active');
        }

        function closeGroupModal() {
            document.getElementById('group-modal').classList.remove('active');
        }

        async function saveGroup() {
            const name = document.getElementById('new-group-name').value.trim();
            if (!name) { toast('Enter group name!', 'error'); return; }
            if (groups.includes(name)) { toast('Group already exists!', 'error'); return; }
            groups.push(name);
            await sync();
            closeGroupModal();
            toast('Group added!', 'success');
        }

        function edit(i) {
            editIdx = i;
            const a = apps[i];
            document.getElementById('modal-title').textContent = 'Edit Applicant';
            document.getElementById('ff').value = a.FirstName||'';
            document.getElementById('fl').value = a.LastName||'';
            document.getElementById('fp').value = a.PassportNo||'';
            document.getElementById('fd').value = a.DateOfBirth||'';
            document.getElementById('fb').value = a.PlaceOfBirth||'';
            document.getElementById('fi').value = a.IssuePlace||'';
            document.getElementById('fg').value = a.group||'';
            document.getElementById('fph').value = '';
            document.getElementById('prev').innerHTML = a.photo ? `<img src="${a.photo}" style="max-width:150px;border-radius:12px;margin-top:10px">` : '';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { 
            document.getElementById('fph').value = '';
            document.getElementById('prev').innerHTML = '';
            document.getElementById('modal').classList.remove('active'); 
        }

        document.getElementById('fph').addEventListener('change', e => {
            const f = e.target.files[0];
            if (!f) return;
            if (f.size > 200*1024) { toast('Photo too large! Max 200KB', 'error'); e.target.value = ''; return; }
            const r = new FileReader();
            r.onload = ev => document.getElementById('prev').innerHTML = `<img src="${ev.target.result}" style="max-width:150px;border-radius:12px;margin-top:10px">`;
            r.readAsDataURL(f);
        });

        document.querySelectorAll('#ff, #fl, #fp, #fd, #fb, #fi').forEach(input => {
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const nextId = input.getAttribute('data-next');
                    if (nextId) {
                        const nextField = document.getElementById(nextId);
                        if (nextField) nextField.focus();
                    }
                }
            });
        });

        document.getElementById('fb').addEventListener('change', e => {
            const placeOfBirth = e.target.value;
            const issuePlaceField = document.getElementById('fi');
            if (!issuePlaceField.value || issuePlaceField.value === '') {
                issuePlaceField.value = placeOfBirth;
            }
        });

        document.getElementById('modal').addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        async function saveApplicant() {
            const fn = document.getElementById('ff').value.trim();
            const ln = document.getElementById('fl').value.trim();
            const pp = document.getElementById('fp').value.trim();
            if (!fn || !ln || !pp) { toast('Fill required fields!', 'error'); return; }
            
            const pf = document.getElementById('fph').files[0];
            let ph = null;
            
            if (pf) {
                console.log(`📸 Photo selected: ${pf.name}, size: ${(pf.size/1024).toFixed(1)}KB`);
                ph = await new Promise(res => {
                    const r = new FileReader();
                    r.onload = e => {
                        console.log(`✅ Photo converted to base64, length: ${e.target.result.length} chars`);
                        res(e.target.result);
                    };
                    r.readAsDataURL(pf);
                });
            } else if (editIdx >= 0 && apps[editIdx].photo) {
                console.log('📸 Using existing photo from edit');
                ph = apps[editIdx].photo;
            } else {
                console.log('⚠️ No photo provided');
            }

            const a = {
                group: document.getElementById('fg').value,
                FirstName: fn, LastName: ln, PassportNo: pp,
                DateOfBirth: document.getElementById('fd').value,
                PlaceOfBirth: document.getElementById('fb').value,
                IssuePlace: document.getElementById('fi').value,
                photo: ph
            };
            
            if (editIdx >= 0) {
                apps[editIdx] = a;
            } else {
                apps.push(a);
            }
            
            if (a.group && !groups.includes(a.group)) groups.push(a.group);
            await sync();
            closeModal();
            toast('Saved!', 'success');
        }

        async function del(i) {
            if (!confirm('Delete this applicant?')) return;
            apps.splice(i, 1);
            await sync();
            toast('Deleted!', 'success');
        }

        async function deleteAll() {
            if (!confirm('Delete ALL applicants?')) return;
            apps = []; groups = [];
            await sync();
            toast('All deleted!', 'success');
        }

        async function deleteGroup(groupName) {
            const count = apps.filter(a => a.group === groupName).length;
            if (!confirm(`Delete group "${groupName}" and its ${count} applicant(s)?`)) return;
            
            groups = groups.filter(g => g !== groupName);
            apps = apps.filter(a => a.group !== groupName);
            
            if (filter === groupName) {
                filter = 'all';
            }
            
            await sync();
            toast('Group deleted!', 'success');
        }

        // ==================== SYNC ====================

        async function sync() {
            try {
                // DEBUG: Check photos before sending
                const photosCount = apps.filter(a => a.photo).length;
                console.log(`🔄 Syncing ${apps.length} applicants to server, ${photosCount} have photos`);
                
                const r = await fetch(API + '/api/applicants/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ applicants: apps, groups })
                });
                const d = await r.json();
                
                // DEBUG: Check photos after receiving from server
                const receivedPhotos = d.data.applicants.filter(a => a.photo).length;
                console.log(`✅ Server returned ${d.data.applicants.length} applicants, ${receivedPhotos} have photos`);
                
                apps = d.data.applicants;
                groups = d.data.groups;
                updateUI();
            } catch (e) { 
                console.error('❌ Sync failed:', e);
                toast('Sync failed!', 'error'); 
            }
        }

        async function syncNow() { 
            await loadData(); 
            toast('Synced!', 'success'); 
        }
        
        // Sync complete applicants WITH photos to all extensions (manual trigger)
        async function syncPhotosToExtensions() {
            try {
                toast('📤 Sending complete applicants WITH photos to extensions...', 'info');
                
                const response = await fetch(API + '/api/sync-photos-to-extensions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    toast(`✅ Complete data WITH photos synced to ${result.connections || 0} extension(s)!`, 'success');
                } else {
                    toast('❌ Sync failed', 'error');
                }
            } catch (error) {
                toast('❌ Error: ' + error.message, 'error');
            }
        }

        // ==================== IMPORT/EXPORT ====================

        function exportData() {
            const s = JSON.stringify({ applicants: apps, groups }, null, 2);
            const b = new Blob([s], { type: 'application/json' });
            const u = URL.createObjectURL(b);
            const l = document.createElement('a');
            l.href = u;
            l.download = `bls-${new Date().toISOString().split('T')[0]}.json`;
            l.click();
            URL.revokeObjectURL(u);
            toast('Exported!', 'success');
        }

        function importData() {
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = 'application/json';
            inp.onchange = async e => {
                const f = e.target.files[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = async ev => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        if (!d.applicants || !Array.isArray(d.applicants)) throw new Error('Invalid');
                        const existingPassports = new Set(apps.map(a => a.PassportNo));
                        const newApps = d.applicants.filter(a => !existingPassports.has(a.PassportNo));
                        apps.push(...newApps);
                        if (d.groups && Array.isArray(d.groups)) {
                            d.groups.forEach(g => { if (!groups.includes(g)) groups.push(g); });
                        }
                        await sync();
                        toast(`Imported ${newApps.length} new!`, 'success');
                    } catch (e) { 
                        toast('Import failed!', 'error'); 
                    }
                };
                r.readAsText(f);
            };
            inp.click();
        }

        function toast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // ==================== INITIALIZATION ====================

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            connectWebSocket();
        });
        
        // Auto-refresh DISABLED - costs too much!
        // Dashboard was downloading 2.4MB every 10 seconds = 207GB/month = $10!
        // Use manual SYNC button instead, or WebSocket will notify of changes
        // setInterval(loadData, 10000);
    </script>
</body>
