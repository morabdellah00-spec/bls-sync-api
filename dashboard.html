<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLS Applicant Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: white; border-radius: 12px; padding: 20px 30px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #667eea; font-size: 24px; }
        .header small { color: #7f8c8d; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 200px; padding: 10px 15px; border: 2px solid #ecf0f1; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ecf0f1; }
        th { background: #f8f9fa; font-weight: 600; }
        .photo-thumb { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .no-photo { width: 40px; height: 40px; border-radius: 50%; background: #ecf0f1; display: flex; align-items: center; justify-content: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid #ecf0f1; display: flex; justify-content: space-between; }
        .modal-body { padding: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #ecf0f1; border-radius: 8px; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 20px; background: #2c3e50; color: white; border-radius: 8px; z-index: 2000; }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>💼 BLS Applicant Manager</h1>
                <small id="userEmail"></small>
            </div>
            <div class="user-info">
                <button class="btn btn-warning" onclick="syncNow()">🔄 Refresh</button>
                <button class="btn btn-success" onclick="forceSyncAll()">📢 SYNC ALL EXTENSIONS</button>
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="card">
            <div class="toolbar">
                <input type="text" class="search-box" placeholder="🔍 Search..." oninput="filterApplicants()">
                <button class="btn btn-success" onclick="showAddModal()">➕ Add Applicant</button>
                <button class="btn btn-warning" onclick="exportData()">💾 Export</button>
                <button class="btn btn-danger" onclick="deleteAll()">🗑️ Delete All</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Passport</th>
                        <th>DOB</th>
                        <th>Place</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="6" style="text-align:center;padding:40px;color:#95a5a6;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Applicant</h2>
                <button onclick="closeModal()" style="background:none;border:none;font-size:24px;cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label>Passport No *</label>
                    <input type="text" id="passportNo" required>
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>
                <div class="form-group">
                    <label>Place of Birth</label>
                    <input type="text" id="placeOfBirth">
                </div>
                <div class="form-group">
                    <label>Photo</label>
                    <input type="file" id="photo" accept="image/*">
                </div>
                <button class="btn btn-success" onclick="saveApplicant()">Save</button>
                <button class="btn btn-danger" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const userEmail = localStorage.getItem('userEmail');

        if (!token) {
            window.location.href = '/';
        }

        document.getElementById('userEmail').textContent = userEmail;

        let applicants = [];
        let groups = [];
        let editIndex = -1;

        async function apiCall(endpoint, options = {}) {
            options.headers = {
                ...options.headers,
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
            const response = await fetch(endpoint, options);
            if (response.status === 401) {
                localStorage.clear();
                window.location.href = '/';
            }
            return response;
        }

        async function loadData() {
            try {
                const response = await apiCall('/api/applicants');
                const data = await response.json();
                applicants = data.applicants || [];
                groups = data.groups || [];
                render();
            } catch (e) {
                toast('Load failed!', 'error');
            }
        }

        function render() {
            const tbody = document.getElementById('tbody');
            if (applicants.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#95a5a6;">No applicants yet. Click "+ Add Applicant" to start.</td></tr>';
                return;
            }

            tbody.innerHTML = applicants.map((a, i) => `
                <tr>
                    <td>${a.photo ? `<img src="${a.photo}" class="photo-thumb">` : '<div class="no-photo">👤</div>'}</td>
                    <td>${a.FirstName} ${a.LastName}</td>
                    <td>${a.PassportNo}</td>
                    <td>${a.DateOfBirth || '-'}</td>
                    <td>${a.PlaceOfBirth || '-'}</td>
                    <td>
                        <button class="btn btn-primary" style="padding:6px 12px;font-size:12px;" onclick="edit(${i})">Edit</button>
                        <button class="btn btn-danger" style="padding:6px 12px;font-size:12px;" onclick="del(${i})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function filterApplicants() {
            // TODO: Implement search
            render();
        }

        function showAddModal() {
            editIndex = -1;
            document.getElementById('firstName').value = '';
            document.getElementById('lastName').value = '';
            document.getElementById('passportNo').value = '';
            document.getElementById('dob').value = '';
            document.getElementById('placeOfBirth').value = '';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        async function saveApplicant() {
            const a = {
                FirstName: document.getElementById('firstName').value,
                LastName: document.getElementById('lastName').value,
                PassportNo: document.getElementById('passportNo').value,
                DateOfBirth: document.getElementById('dob').value,
                PlaceOfBirth: document.getElementById('placeOfBirth').value,
                photo: '' // TODO: Handle photo upload
            };

            if (!a.FirstName || !a.LastName || !a.PassportNo) {
                toast('Fill required fields!', 'error');
                return;
            }

            if (editIndex >= 0) {
                applicants[editIndex] = a;
            } else {
                applicants.push(a);
            }

            await sync();
            closeModal();
            toast('Saved!', 'success');
        }

        function edit(i) {
            editIndex = i;
            const a = applicants[i];
            document.getElementById('firstName').value = a.FirstName;
            document.getElementById('lastName').value = a.LastName;
            document.getElementById('passportNo').value = a.PassportNo;
            document.getElementById('dob').value = a.DateOfBirth || '';
            document.getElementById('placeOfBirth').value = a.PlaceOfBirth || '';
            document.getElementById('modal').classList.add('active');
        }

        async function del(i) {
            if (!confirm('Delete?')) return;
            applicants.splice(i, 1);
            await sync();
            toast('Deleted!', 'success');
        }

        async function deleteAll() {
            if (!confirm('Delete ALL?')) return;
            try {
                await apiCall('/api/applicants', { method: 'DELETE' });
                applicants = [];
                groups = [];
                render();
                toast('All deleted!', 'success');
            } catch (e) {
                toast('Delete failed!', 'error');
            }
        }

        async function sync() {
            try {
                const response = await apiCall('/api/applicants/sync', {
                    method: 'POST',
                    body: JSON.stringify({ applicants, groups })
                });
                const data = await response.json();
                applicants = data.data.applicants;
                groups = data.data.groups;
                render();
            } catch (e) {
                toast('Sync failed!', 'error');
            }
        }

        async function syncNow() {
            await loadData();
            toast('Synced!', 'success');
        }

        async function forceSyncAll() {
            try {
                const response = await apiCall('/api/force-sync', { method: 'POST' });
                const data = await response.json();
                toast(`📢 ${data.message}`, 'success');
            } catch (e) {
                toast('Force sync failed!', 'error');
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify({ applicants, groups }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bls-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            toast('Exported!', 'success');
        }

        async function logout() {
            try {
                await apiCall('/api/auth/logout', { method: 'POST' });
            } catch (e) {}
            localStorage.clear();
            window.location.href = '/';
        }

        function toast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        loadData();
    </script>
</body>
</html>
